# Grants cluster-admin to the Pocket ID user (oidc-username-claim=sub, no
# username prefix, so the apiserver identity is "<issuer>#<sub>").
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: "https://pid.saleem.us#2eefa725-89b0-4577-9287-205436e9eb7c"

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloud
resources:
  - pvc.yaml
  - secret.sops.yaml
  - init-secret.yaml
  - dnsendpoint.yaml
  - httproute.yaml
helmCharts:
  - name: app-template
    repo: https://bjw-s-labs.github.io/helm-charts
    version: 4.6.2
    releaseName: opencloud
    namespace: cloud
    valuesFile: values.yaml
    includeCRDs: false
commonAnnotations:
  argocd.argoproj.io/sync-wave: "0"

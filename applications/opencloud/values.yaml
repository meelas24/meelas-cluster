controllers:
  main:
    containers:
      app:
        image:
          repository: opencloudeu/opencloud
          tag: latest
        env:
          PROXY_HTTP_ADDR: "0.0.0.0:9200"
          OC_URL: "https://opencloud.saleem.us"
          OCIS_INSECURE: "false"
        envFrom:
          - secretRef:
              name: opencloud-secret
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 9200
              initialDelaySeconds: 30
              periodSeconds: 10
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 9200
              initialDelaySeconds: 10
              periodSeconds: 5
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 9200
              failureThreshold: 30
              periodSeconds: 5
        resources:
          requests:
            memory: 512Mi
            cpu: 200m
          limits:
            memory: 2Gi

service:
  app:
    controller: main
    ports:
      http:
        port: 9200

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: opencloud-config
    globalMounts:
      - path: /etc/opencloud
  data:
    type: hostPath
    hostPath: /Data
    globalMounts:
      - path: /var/lib/opencloud

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opencloud
  namespace: cloud
spec:
  parentRefs:
    - name: gateway-external
      namespace: network
      sectionName: https
  hostnames:
    - opencloud.saleem.us
  rules:
    - backendRefs:
        - name: opencloud
          port: 9200
          weight: 1

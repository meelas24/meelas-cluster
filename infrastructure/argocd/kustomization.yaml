apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

resources:
  - ns.yaml
  - http-route.yaml
  - lb-service.yaml


helmCharts:
  - name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: 10.11.6
    releaseName: "argocd"
    namespace: argocd
    valuesFile: values.yaml

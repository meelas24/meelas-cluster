cronjob:
  schedule: "0 * * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  concurrencyPolicy: Forbid

renovate:
  config: |
    {
      "platform": "github",
      "autodiscover": false,
      "repositories": ["meelas24/meelas-cluster"],
      "onboarding": false,
      "requireConfig": "required"
    }
  # Container-level. Renovate clones into /tmp, so no readOnlyRootFilesystem.
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

# Pod-level
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

env:
  LOG_LEVEL: info

envFrom:
  - secretRef:
      name: renovate-secret

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres17
  namespace: databases
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.4
  primaryUpdateStrategy: unsupervised
  storage:
    size: 100Gi
    storageClass: zfs-localpv
  enableSuperuserAccess: true
  # Kernel 7.0.0-42 stacks cri-containerd.apparmor.d on unconfined and denies
  # signals between processes (postgres: "could not signal for checkpoint").
  # Restate the CNPG defaults, since this block replaces them.
  podSecurityContext:
    runAsUser: 26
    runAsGroup: 26
    runAsNonRoot: true
    fsGroup: 26
    seccompProfile:
      type: RuntimeDefault
    appArmorProfile:
      type: Unconfined
  monitoring:
    enablePodMonitor: false
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      memory: 1Gi
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: 512MB
